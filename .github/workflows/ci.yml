# CI gate. See MAINTENANCE.md (Layer B).
# Runs on PRs, pushes to main, manually, and monthly. The monthly run matters:
# pluginVerification uses recommended() IDEs, so it catches breakage from new IntelliJ
# releases even when nobody has touched the repo.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 6 1 * *"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew build verifyPluginStructure

      - name: Verify plugin against recommended IDEs
        run: ./gradlew verifyPlugin

      - name: Build plugin zip
        run: ./gradlew buildPlugin

      - uses: actions/upload-artifact@v7
        with:
          name: plugin-zip
          path: build/distributions/*.zip
          if-no-files-found: error
